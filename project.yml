name: Habla
options:
  bundleIdPrefix: net.ulfhedinn
  deploymentTarget:
    iOS: "18.1"
    macOS: "15.1"
  xcodeVersion: "16.2"
targets:
  Habla:
    type: application
    platform: [iOS, macOS]
    sources: [Habla/Sources]
    info:
      path: Habla/Info.plist
      properties:
        CFBundleDisplayName: Habla
        NSMicrophoneUsageDescription: "Habla needs the microphone for conversation practice."
        NSSpeechRecognitionUsageDescription: "Habla uses speech recognition to transcribe your speech."
    entitlements:
      path: Habla/Habla.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.developer.foundation-models.inference: true
